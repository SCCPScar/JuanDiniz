<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel administrativo — A Barbearia de Odin</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../auth.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<main class="admin-login-wrap">
  <div class="auth-modal admin-login-card">
    <p class="eyebrow">Área restrita</p>
    <h2>Painel administrativo</h2>
    <form id="formAdminLogin" class="auth-form" novalidate>
      <label for="adminEmail">E-mail</label>
      <input type="email" id="adminEmail" name="email" required autocomplete="email">

      <label for="adminSenha">Palavra-passe</label>
      <input type="password" id="adminSenha" name="senha" required autocomplete="current-password">

      <p class="auth-error" id="adminLoginErro" hidden></p>

      <button type="submit" class="btn-primary auth-submit">Entrar</button>
    </form>
    <p class="auth-switch"><a href="../index.html">← Voltar ao site</a></p>
  </div>
</main>

<script src="admin.js"></script>
</body>
</html>
